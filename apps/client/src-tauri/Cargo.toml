[package]
name = "isola"
version = "0.1.0"
description = "Isola client"
authors = ["Isola contributors"]
license = "MIT"
repository = "https://github.com/shenmuegit/Isola"
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "isola_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.2" }

[dependencies]
tauri = { version = "2.12.3" }
